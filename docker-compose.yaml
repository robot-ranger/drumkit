services: 
  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001' 
    volumes:
      - /home/pi/drumkit/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  drumkit:
      build: 
        context: .
        dockerfile: docker/Dockerfile.drumkit
      restart: unless-stopped
      environment:
        - MQTT_BROKER=mosquitto
        - MQTT_PORT=1883
        - MQTT_BASE=drums
      devices:
        - /dev/bus/usb:/dev/bus/usb   # all USB, or narrow to a specific device
        - /dev/snd:/dev/snd           # ALSA sequencer for MIDI
      depends_on:
        mosquitto:
          condition: service_healthy
  gpio:
      build: 
        context: .
        dockerfile: docker/Dockerfile.gpio
      restart: unless-stopped
      environment:
        - MQTT_BROKER=mosquitto
        - MQTT_PORT=1883
        - MQTT_BASE=drums
        - RPI_LGPIO_REVISION=00c04170  # Pi hardware revision (replaces /proc/device-tree bind-mount)
      devices:
        - /dev/gpiochip0:/dev/gpiochip0  # GPIO access for Raspberry Pi
      depends_on:
        mosquitto:
          condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - '8000:80'
    depends_on:
      mosquitto:
        condition: service_healthy

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock